# 分类体系 taxonomy（冻结契约 v1 §2）
# 用途：agent 收到新资料时，用 keywords 对「标题 + 正文前 2000 字」打分，选出建议大类与子类。
# 重要：这里只产出「建议分类」，最终分类以用户审核为准；用户可以随时增删本文件内容。
version: 1
default_category: 未分类
default_subcategory: 通用
match_rule:
  - 命中关键词数量最多的大类胜出
  - 数量并列时取 order 更小（更靠前）者
  - 命中数为 0 时归入 default_category（未分类/通用）
  - 子类：kb.ps1 不做关键词匹配，只取 `kb.cmd add -Subcategory` 传入值，
    未传则用 default_subcategory（即 meta 里的 subcategory_suggested 常为「通用」，这是兜底不是判断结论）。
    真正的子类由 agent 读本文件的 subcategories 列表后提议、写进提案，最终以用户审核为准。
    新增子类只往对应 categories[].subcategories 里追加即可。

categories:
  - name: 技术工程
    order: 1
    # 2026-10-09 用户裁定：纯追加子类「自动控制」（控制理论/自动控制原理类资料用）。
    # 同时补一批控制领域触发词，避免这类资料因关键词全不命中而被兜底成「未分类/通用」。
    subcategories: [前端, 后端, 数据库, 运维部署, 网络与安全, 工程质量, 自动控制]
    keywords: [代码, 编程, 前端, 后端, 接口, API, 数据库, SQL, 索引, 缓存, 并发, 容器, Docker, K8s, 部署, 服务器, 网络, 协议, 加密, 漏洞, 性能, 报错, 异常, 编译, 框架, 重构, 测试, git, 自动控制, 控制理论, 控制系统, 传递函数, 反馈, 根轨迹, 频率特性, 幅频, 相频, 状态空间, 能控性, 能观性, 李雅普诺夫, 极点配置, 校正, 稳态误差, 相平面, 描述函数]
  - name: 产品业务
    order: 2
    subcategories: [产品设计, 需求分析, 运营增长, 商业模式, 项目管理]
    keywords: [产品, 需求, 用户, 功能, 原型, PRD, 埋点, 转化, 留存, 增长, 运营, 投放, 商业, 盈利, 定价, 竞品, 项目管理, 排期, 复盘, 指标]
  - name: 学术研究
    order: 3
    subcategories: [论文方法, 统计与实验, 理论基础, 文献综述, 学术写作]
    keywords: [论文, 文献, 综述, 实验, 假设, 显著性, 样本, 统计, 模型拟合, 定理, 证明, 引用, 研究, 元分析, doi, 期刊, 摘要]
  - name: 生活健康
    order: 4
    subcategories: [饮食营养, 运动健身, 睡眠作息, 心理健康, 医疗用药]
    keywords: [饮食, 营养, 热量, 卡路里, 蛋白质, 运动, 健身, 训练, 睡眠, 作息, 心理, 情绪, 焦虑, 压力, 用药, 疾病, 症状, 体检, 医院, 康复]
  - name: 财务投资
    order: 5
    subcategories: [理财规划, 投资品种, 宏观经济, 税务合规, 风险管理]
    keywords: [理财, 投资, 基金, 股票, 债券, 利率, 通胀, 宏观, GDP, 汇率, 税, 报税, 保险, 收益, 风险, 仓位, 复利, 现金流, 资产]
  - name: 人文社科
    order: 6
    subcategories: [历史, 哲学, 社会学, 文学艺术, 语言学习]
    keywords: [历史, 朝代, 哲学, 伦理, 社会, 文化, 人类学, 文学, 小说, 艺术, 音乐, 电影, 语言, 语法, 词汇, 翻译, 考古, 宗教]
  - name: 工具流程
    order: 7
    subcategories: [软件工具, 效率方法, 自动化脚本, 工作流, 快捷键]
    keywords: [工具, 软件, 插件, 配置, 快捷键, 模板, 自动化, 脚本, 流程, SOP, 清单, 效率, 笔记, 同步, 备份, 版本控制, 命令行, 批处理]
  - name: 未分类
    order: 99
    subcategories: [通用, 待归类, 待整理]
    keywords: []
